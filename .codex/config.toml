# feedback-hub の Codex 設定（プロジェクトを「信頼」したときだけ読み込まれる）
# 書き込みは作業ディレクトリの中だけ、ネットワークなし。サンドボックスの外に出る操作は承認を求める
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = false

# MCP（接続先は docs/mcp-policy.md でチームとして決めたものだけ）
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_PAT"
http_headers = { "X-MCP-Toolsets" = "issues,pull_requests,actions", "X-MCP-Readonly" = "true", "X-MCP-Lockdown" = "true" }

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.83", "--headless", "--isolated"]
