version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 公開直後の版はすぐ入れない（サプライチェーン攻撃への備え。pnpm の minimumReleaseAge と同じ考え方）
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 大きな版上げはチームで判断する（Node の版に合わせる @types/node、型チェッカーが入れ替わる TypeScript 7 など）
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
