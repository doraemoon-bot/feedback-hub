# PR や Issue のコメントで @claude と書いたときだけ Claude Code が動く（対話型を GitHub 上で）
# 認証: Claude のサブスクリプション（Max）のトークン。claude setup-token で発行し、Secrets の CLAUDE_CODE_OAUTH_TOKEN に登録する
name: Claude（@claude メンション）

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 30"
